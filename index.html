function saveBrandDictEntry(ref) {
  const enEl = document.getElementById('dict-en');
  const zhEl = document.getElementById('dict-zh');
  const aliasEl = document.getElementById('dict-alias');
  const en = (enEl ? enEl.value : '').trim();
  const zh = normalizeNameList(zhEl ? zhEl.value : '');
  const alias = normalizeNameList(aliasEl ? aliasEl.value : '');

  if (!en && !zh.length) { showToast('英文名和中文名至少填一个', 'error'); return; }

  const dict = getUserBrandDict();
  const rows = getBrandDictRows();
  const row = ref ? rows.find(r => r.ref === ref) : null;
  const now = new Date().toISOString();

  // 英文名是规范主名，已有英文名的词条不允许清空（防手滑把品牌弄丢）
  if (!en && row && row.en) {
    showToast('英文名不能清空，如需改名请直接填写新的英文名', 'error');
    return;
  }

  // 原本指向哪条内置词条（编辑内置 / 编辑已有的覆盖条目时都要保持绑定）
  let origBuiltin = '';
  if (ref && ref.indexOf('b:') === 0) {
    const b = BUILTIN_BRAND_DICT[parseInt(ref.slice(2), 10)];
    if (b) origBuiltin = b.en;
  } else if (row && row.source === 'override' && row.userIndex >= 0) {
    const prev = dict[row.userIndex] || {};
    origBuiltin = prev.builtinKey
      || ((BUILTIN_BRAND_DICT.find(b => normBrandName(b.en) === normBrandName(prev.en || '')) || {}).en || '');
  }
  if (!origBuiltin && en) {
    const hit = BUILTIN_BRAND_DICT.find(b => normBrandName(b.en) === normBrandName(en));
    if (hit) origBuiltin = hit.en;
  }

  const payload = { en: en, zh: zh, alias: alias, updatedAt: now };
  if (origBuiltin) payload.builtinKey = origBuiltin;

  if (row && row.userIndex >= 0 && dict[row.userIndex]) {
    dict[row.userIndex] = payload;
  } else {
    dict.push(payload);
  }

  invalidateBrandIndex();
  saveData();
  closeModal();
  renderBrandDictView();
  showToast('词条已保存，全站立即生效', 'success');
}

function deleteBrandDictEntry(ref) {
  const rows = getBrandDictRows();
  const row = rows.find(r => r.ref === ref);
  if (!row || row.userIndex < 0) return;

  const isOverride = row.source === 'override';
  const label = row.en || row.zh[0] || '该词条';
  if (!confirm(isOverride ? `恢复「${label}」的内置内容？` : `确定删除「${label}」这条自定义词条？`)) return;

  const dict = getUserBrandDict();
  dict.splice(row.userIndex, 1);
  invalidateBrandIndex();
  saveData();
  renderBrandDictView();
  showToast(isOverride ? '已恢复内置内容' : '词条已删除', 'info');
}

function exportBrandDict() {
  const rows = getBrandDictRows().map(r => ({
    en: r.en, zh: r.zh, alias: r.alias, source: r.source
  }));
  const data = {
    exportedAt: new Date().toISOString(),
    count: rows.length,
    brands: rows
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '品牌词典-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  showToast('词典已导出', 'success');
}

/* ---- 待补译名：扫已录入产品线里词典没有的品牌 + 词典里只填了单一语言的词条 ---- */
function scanDictPending() {
  const map = new Map();
  appData.suppliers.forEach(s => {
    (s.productLines || []).forEach(pl => {
      const f = brandFieldsOf(pl);
      const name = f.en || f.zh[0] || '';
      if (!name) return;
      if (resolveBrandName(name).known) return;
      const key = brandEntityKey(pl) || normBrandName(name);
      if (!key) return;
      if (!map.has(key)) {
        map.set(key, { key, en: f.en || '', zh: f.zh.slice(), count: 0 });
      }
      map.get(key).count++;
    });
  });
  // 自动同步进来的单语词条也要能在这里补齐另一种语言（内置词条不算，属系统预置）
  getBrandDictRows().forEach(r => {
    if (r.source === 'builtin') return;
    const en = String(r.en || '').trim();
    const zh = (r.zh || []).slice();
    if (en && zh.length) return;                 // 双语齐全，不用补
    const key = normBrandName(en || zh[0] || '');
    if (!key) return;
    if (!map.has(key)) map.set(key, { key, en: en, zh: zh, count: 0 });
  });
  dictPending = Array.from(map.values()).sort((a, b) => b.count - a.count);
  renderDictPendingCard();
  showToast(dictPending.length
    ? `发现 ${dictPending.length} 个品牌待补译名`
    : '已录入的品牌都能配对，没有待补项', dictPending.length ? 'info' : 'success');
}

function renderDictPendingCard() {
  const card = document.getElementById('dict-pending-card');
  if (!card) return;

  if (dictPending === null) {
    card.innerHTML = `
      <div class="card-header"><h3>&#x2462; 待补译名</h3></div>
      <div class="card-body">
        <div class="batch-hint" style="margin-top:0">
          扫一遍已录入的产品线和词典本身，把还没配上双语（只有中文或只有英文）的品牌挑出来。补上另一种语言后写进词典，以后录入同一品牌（写英文或中文都行）自动配对。
        </div>
        <div class="batch-actions">
          <button class="btn btn-primary" onclick="scanDictPending()">&#x1F50D; 扫描已录入品牌</button>
        </div>
      </div>`;
    return;
  }

  if (!dictPending.length) {
    card.innerHTML = `
      <div class="card-header">
        <h3>&#x2462; 待补译名</h3>
        <span class="count">0 个</span>
      </div>
      <div class="card-body">
        <div class="batch-done" style="display:block">&#x2705; 已录入的品牌全部能双语配对，没有待补项。</div>
        <div class="batch-actions">
          <button class="btn btn-sm" onclick="scanDictPending()">重新扫描</button>
        </div>
      </div>`;
    return;
  }

  const rows = dictPending.map((p, i) => {
    const needZh = !!p.en;
    const shown = p.en || p.zh.join('、');
    return `
      <div class="pending-trans-row">
        <span class="pending-trans-name">${escHtml(shown)}${p.count ? `<span class="dict-hit">${p.count} 条</span>` : ''}</span>
        <input type="text" id="dict-fill-${i}"
          placeholder="${needZh ? '填写中文名，多个用、分隔' : '填写英文名'}" />
      </div>`;
  }).join('');

  card.innerHTML = `
    <div class="card-header">
      <h3>&#x2462; 待补译名</h3>
      <span class="count">${dictPending.length} 个品牌</span>
    </div>
    <div class="card-body">
      <div class="pending-trans-list">${rows}</div>
      <div class="batch-actions">
        <button class="btn btn-primary" onclick="saveDictPendingFills()">保存到词典并重新配对</button>
        <button class="btn" onclick="scanDictPending()">重新扫描</button>
        <button class="btn" onclick="dictPending=null;renderDictPendingCard()">收起</button>
      </div>
      <div class="batch-hint">留空的会跳过，绝不自作主张翻译。</div>
    </div>`;
}

function saveDictPendingFills() {
  let learned = 0, skipped = 0;
  (dictPending || []).forEach((p, i) => {
    const el = document.getElementById('dict-fill-' + i);
    if (!el) return;
    const val = normalizeNameList(el.value);
    if (!val.length) { skipped++; return; }
    const en = p.en || val[0];
    const zh = p.en ? val : p.zh.slice();
    if (learnBrandPair(en, zh)) learned++;
  });
  invalidateBrandIndex();
  if (learned) saveData();
  scanDictPending();
  showToast(learned ? `已补充 ${learned} 个品牌译名` : '没有填写新的译名', learned ? 'success' : 'info');
}

/* ---- 一次性初始化：把已录入品牌全量灌入词典 ----------------------------------
   只读遍历 appData.suppliers，绝不修改供应商 / 产品线 / 品牌归属；
   先出预览（扫描条数、合并后条数、去重数、未收录清单）→ 用户确认 → 才写入 appData.brandDict。
   写入复用 syncBrandToDict，去重合并规则与日常自动同步完全一致，不改变既有逻辑。
----------------------------------------------------------------------------- */
let brandImportPlan = null;

// 一条产品线里出现过的所有原始品牌写法（只读，不改数据）
function brandRawNamesOf(pl) {
  const out = [];
  const push = (v) => {
    normalizeNameList(v).forEach(x => out.push(x));
    // 「TI (德州仪器)」这类整体 + 拆开都收一份，便于后面识别别名
    splitBrandName(v).forEach(x => out.push(x));
  };
  push(pl.brandEn);
  push(pl.brandZh);
  push(pl.brand);
  return unionNames(out);
}

// 扫描全部产品线 → 有效记录 + 未收录清单（任何异常都只跳过这一条，不中断）
function collectBrandRecords() {
  const recs = [];
  const skipped = [];
  const suppliers = (appData && Array.isArray(appData.suppliers)) ? appData.suppliers : [];

  suppliers.forEach(s => {
    const supName = String((s && s.name) || '未命名供应商');
    const lines = (s && Array.isArray(s.productLines)) ? s.productLines : [];
    lines.forEach((pl, li) => {
      const base = {
        supplier: supName,
        line: String((pl && pl.lineName) || '') || ('第 ' + (li + 1) + ' 条产品线')
      };
      try {
        if (!pl || typeof pl !== 'object' || Array.isArray(pl)) {
          skipped.push(Object.assign({}, base, { raw: '', reason: '产品线结构异常，读不出品牌' }));
          return;
        }
        const rawNames = brandRawNamesOf(pl);
        if (!rawNames.length) {
          skipped.push(Object.assign({}, base, { raw: '', reason: '品牌为空（没填品牌）' }));
          return;
        }
        const printable = rawNames.join(' / ');
        if (!rawNames.some(n => normBrandName(n))) {
          skipped.push(Object.assign({}, base, { raw: printable, reason: '品牌名只有符号或空白' }));
          return;
        }

        const f = brandFieldsOf(pl);
        const probe = f.en || f.zh[0] || rawNames[0];
        const res = resolveBrandName(probe);
        const canonEn = (res.known && res.en) ? res.en : (f.en || '');
        const zhList = unionNames(f.zh, res.known ? res.zh : []);
        if (!canonEn && !zhList.length) {
          skipped.push(Object.assign({}, base, { raw: printable, reason: '识别不出可用的品牌名' }));
          return;
        }

        const key = brandEntityKey(pl) || normBrandName(canonEn || zhList[0]);
        if (!key) {
          skipped.push(Object.assign({}, base, { raw: printable, reason: '品牌名归一化后为空' }));
          return;
        }

        // 别名 = 原始写法里既不是规范英文名、也不在中文名列表中的那些
        const canonSet = new Set([canonEn].concat(zhList).map(normBrandName).filter(Boolean));
        const alias = [];
        rawNames.forEach(n => {
          splitBrandName(n).forEach(p => {
            const k = normBrandName(p);
            if (!k || canonSet.has(k)) return;
            if (alias.some(a => normBrandName(a) === k)) return;
            alias.push(p);
          });
        });

        // 判断「能不能确定是同一个品牌」，不确定的标待核对，绝不强行合并
        const reasons = [];
        const rawEn = String(pl.brandEn || '').trim();
        const rawBrand = String(pl.brand || '').trim();
        if (rawEn && rawBrand && normBrandName(rawEn) !== normBrandName(rawBrand)) {
          const r1 = resolveBrandName(rawEn);
          const r2 = resolveBrandName(rawBrand);
          if (!r1.known && !r2.known && r1.key !== r2.key) {
            reasons.push('品牌字段「' + rawBrand + '」和英文名「' + rawEn + '」写法不同，无法确认是同一品牌');
          }
        }
        const unknownLat = [];
        rawNames.forEach(n => {
          splitBrandName(n).forEach(p => {
            if (hasCJK(p)) return;
            if (resolveBrandName(p).known) return;          // 词典认识的写法，不算歧义
            if (unknownLat.some(x => normBrandName(x) === normBrandName(p))) return;
            unknownLat.push(p);
          });
        });
        if (unknownLat.length > 1) {
          reasons.push('这条记录里有多个英文写法（' + unknownLat.join(' / ') + '），可能是合并品牌或误填');
        }

        recs.push({
          key: key,
          en: canonEn,
          zh: zhList,
          alias: alias,
          known: !!res.known,
          reasons: reasons,
          supplier: supName,
          line: base.line,
          raw: printable
        });
      } catch (err) {
        skipped.push(Object.assign({}, base, {
          raw: '',
          reason: '解析异常：' + ((err && err.message) || err || '未知错误')
        }));
      }
    });
  });

  return { recs: recs, skipped: skipped, supplierCount: suppliers.length };
}

// 按品牌实体分组合并 → 预览计划
function buildBrandImportPlan() {
  const scan = collectBrandRecords();
  const map = new Map();

  scan.recs.forEach(r => {
    let g = map.get(r.key);
    if (!g) {
      g = { key: r.key, en: '', zh: [], alias: [], known: false, records: 0, sources: [], reasons: [] };
      map.set(r.key, g);
    }
    g.records++;
    g.sources.push({ supplier: r.supplier, line: r.line });

    // 英文名：词典里的规范写法优先，其次沿用第一条
    if (r.en) {
      if (!g.en) g.en = r.en;
      else if (r.known && !g.known) g.en = r.en;
      else if (normBrandName(r.en) !== normBrandName(g.en)) {
        // 同一实体下的其它英文写法 → 收作别名，不另建词条
        if (!g.alias.some(a => normBrandName(a) === normBrandName(r.en))) g.alias.push(r.en);
      }
    }
    if (r.known) g.known = true;
    g.zh = unionNames(g.zh, r.zh);
    g.alias = unionNames(g.alias, r.alias);
    r.reasons.forEach(x => { if (g.reasons.indexOf(x) < 0) g.reasons.push(x); });
  });

  const groups = Array.from(map.values());
  // 别名里如果混进了和主名互不相认的英文写法，也算说不清
  groups.forEach(g => {
    const clash = g.alias.filter(a =>
      !hasCJK(a) &&
      normBrandName(a) !== normBrandName(g.en) &&
      !resolveBrandName(a).known);
    if (clash.length && !g.reasons.some(x => x.indexOf('多个英文写法') === 0)) {
      g.reasons.push('同一实体下有多个互不相认的英文写法（' + clash.join(' / ') + '）');
    }
    g.alias = g.alias.filter(a => {
      const k = normBrandName(a);
      if (!k) return false;
      if (k === normBrandName(g.en)) return false;
      if (g.zh.some(z => normBrandName(z) === k)) return false;
      return true;
    });
    g.needEn = !g.en;
    g.needZh = !g.zh.length;
    g.review = g.reasons.length > 0;
  });

  // 用真实合并规则空跑一遍，预演「会新增几条」，不改动任何数据
  // 以词典「可见行数」为准：改写内置词条只是补充，不算新增一条品牌
  const dictBackup = JSON.parse(JSON.stringify(Array.isArray(appData.brandDict) ? appData.brandDict : []));
  let willAdd = 0, willMerge = 0;
  try {
    groups.forEach(g => {
      const before = getBrandDictRows().length;
      const changed = syncBrandToDict({ en: g.en, zh: g.zh, alias: g.alias });
      if (getBrandDictRows().length > before) willAdd++;
      else if (changed) willMerge++;
    });
  } catch (e) { /* 预演失败不影响真实统计 */ }
  appData.brandDict = dictBackup;
  invalidateBrandIndex();

  return {
    supplierCount: scan.supplierCount,
    scanned: scan.recs.length,
    groups: groups,
    skipped: scan.skipped,
    unique: groups.length,
    duplicates: scan.recs.length - groups.length,
    pendingTrans: groups.filter(g => g.needEn || g.needZh).length,
    review: groups.filter(g => g.review).length,
    willAdd: willAdd,
    willMerge: willMerge
  };
}

// 确认后真正写入
function confirmBrandImport() {
  const plan = brandImportPlan;
  if (!plan || !plan.groups) { showToast('没有可导入的内容，请重新扫描', 'error'); return; }

  let added = 0, merged = 0, failed = 0;
  plan.groups.forEach(g => {
    try {
      const before = getBrandDictRows().length;
      const changed = syncBrandToDict({ en: g.en, zh: g.zh, alias: g.alias });
      if (getBrandDictRows().length > before) added++;
      else if (changed) merged++;
    } catch (e) {
      failed++;
    }
  });

  // 写入后再给「待核对」的词条打标记，方便之后逐个确认
  let reviewMarked = 0;
  plan.groups.forEach(g => {
    if (!g.review) return;
    if (markDictEntryReview(g, g.reasons)) reviewMarked++;
  });

  invalidateBrandIndex();
  saveData();
  closeModal();
  brandImportPlan = null;
  renderBrandDictView();
  renderBrandDictSidebar();

  const extra = [];
  if (reviewMarked) extra.push(reviewMarked + ' 条待核对');
  if (plan.skipped.length) extra.push(plan.skipped.length + ' 条未收录');
  if (failed) extra.push(failed + ' 条写入失败');
  showToast('已写入词典：新增 ' + added + ' 条、补充 ' + merged + ' 条'
    + (extra.length ? '（' + extra.join('，') + '）' : ''), 'success');
}

// 给词条打「待核对」标记（按实体名匹配，英语/中文/别名任意一种对上即可）
function markDictEntryReview(g, reasons) {
  const dict = getUserBrandDict();
  const names = [g.en].concat(g.zh, g.alias).map(normBrandName).filter(Boolean);
  if (!names.length) return false;
  for (let i = 0; i < dict.length; i++) {
    const e = dict[i];
    if (!e) continue;
    if (!brandEntryNames(e).some(x => names.indexOf(normBrandName(x)) >= 0)) continue;
    e.review = true;
    e.reviewReasons = (reasons || []).slice(0, 3);
    e.updatedAt = new Date().toISOString();
    return true;
  }
  return false;
}

// ===== IndexedDB backup (more persistent than localStorage) =====
const IDB_NAME = 'supplier_wb';
const IDB_STORE = 'kv';
function idbGet(key) {
  return new Promise((resolve) => {
    try {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      req.onsuccess = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) { resolve(null); return; }
        try {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const g = tx.objectStore(IDB_STORE).get(key);
          g.onsuccess = () => resolve(g.result || null);
          g.onerror = () => resolve(null);
        } catch(err) { resolve(null); }
      };
      req.onerror = () => resolve(null);
    } catch(e) { resolve(null); }
  });
}
function idbSet(key, val) {
  try {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) return;
      try {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(val, key);
      } catch(err) {}
    };
  } catch(e) {}
}

let ghSyncTimer = null;

// GitHub API fetch with timeout + multi CORS proxy fallback (for China network issues)
async function ghFetch(url, options = {}, timeoutMs = 15000) {
  // Try 1: Direct connection
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    const resp = await fetch(url, { ...options, signal: controller.signal });
    clearTimeout(timer);
    return resp;
  } catch(e1) {
    // Try 2: corsproxy.io
    try {
      const proxyUrl = 'https://corsproxy.io/?url=' + encodeURIComponent(url);
      const controller2 = new AbortController();
      const timer2 = setTimeout(() => controller2.abort(), timeoutMs);
      const resp2 = await fetch(proxyUrl, { ...options, signal: controller2.signal });
      clearTimeout(timer2);
      if (resp2.ok) return resp2;
    } catch(e2) {}
    // Try 3: allorigins.win
    try {
      const proxyUrl2 = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
      const controller3 = new AbortController();
      const timer3 = setTimeout(() => controller3.abort(), timeoutMs);
      const resp3 = await fetch(proxyUrl2, { ...options, signal: controller3.signal });
      clearTimeout(timer3);
      if (resp3.ok) return resp3;
    } catch(e3) {}
    throw new Error('All fetch attempts failed');
  }
}

async function githubCheckStatus() {
  const display = document.getElementById('gh-status-display');
  if (!display) return;
  const cfg = getGhConfig();
  if (!cfg || !cfg.token || !cfg.owner || !cfg.repo) {
    display.innerHTML = '<div class="gh-status-bar info">&#8505;&#65039; 请先填写 GitHub 配置信息</div>';
    return;
  }
  display.innerHTML = '<div class="gh-status-bar info">&#8987;&#65039; 正在检查连接...</div>';
  try {
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
    const resp = await ghFetch(url, {
      headers: { 'Authorization': `Bearer ${cfg.token}`, 'Accept': 'application/vnd.github+json' }
    });
    if (resp.status === 200) {
      const data = await resp.json();
      const date = new Date(data.commit.commit.committer.date);
      const dateStr = date.toLocaleString('zh-CN');
      let supplierCount = 0;
      try {
        const content = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, '')))));
        supplierCount = content.suppliers ? content.suppliers.length : 0;
      } catch {}
      display.innerHTML = `<div class="gh-status-bar ok">&#9989; 已连接 &middot; 云端有 ${supplierCount} 个供应商 &middot; 更新于 ${dateStr}</div>`;
    } else if (resp.status === 404) {
      display.innerHTML = '<div class="gh-status-bar warn">&#9888;&#65039; 仓库已连接，云端暂无数据文件，点击「推送到云端」创建</div>';
    } else if (resp.status === 401) {
      display.innerHTML = '<div class="gh-status-bar err">&#10060;&#160;Token 无效或已过期，请重新创建</div>';
    } else if (resp.status === 403) {
      display.innerHTML = '<div class="gh-status-bar err">&#10060;&#160;Token 权限不足，请确保授权了仓库 Contents 读写权限</div>';
    } else {
      display.innerHTML = `<div class="gh-status-bar err">&#10060;&#160;连接失败 (HTTP ${resp.status})</div>`;
    }
  } catch (e) {
    display.innerHTML = '<div class="gh-status-bar err">&#10060;&#160;网络错误（国内访问 GitHub 可能不稳定），可尝试推送/拉取操作，代理会自动兜底</div>';
  }
}

async function githubSync() {
  const cfg = getGhConfig();
  if (!cfg || !cfg.token || !cfg.owner || !cfg.repo) {
    showToast('请先配置 GitHub 信息', 'error');
    openGithubSettings();
    return;
  }
  if (ghSyncing) { showToast('正在同步中，请稍候...', 'info'); return; }
  ghSyncing = true;
  updateSyncDot();
  showToast('正在推送数据到 GitHub...', 'info');

  try {
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
    // First, try to get existing file SHA
    let sha = null;
    try {
      const getResp = await ghFetch(url, {
        headers: { 'Authorization': `Bearer ${cfg.token}`, 'Accept': 'application/vnd.github+json' }
      });
      if (getResp.status === 200) {
        const getData = await getResp.json();
        sha = getData.sha;
      }
    } catch {}

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(appData, null, 2))));
    const body = {
      message: `sync: ${new Date().toLocaleString('zh-CN')} - ${appData.suppliers.length} suppliers`,
      content: content
    };
    if (sha) body.sha = sha;

    const putResp = await ghFetch(url, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${cfg.token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (putResp.status === 200 || putResp.status === 201) {
      hasUnsyncedChanges = false;
      showToast(`已推送到 GitHub (${appData.suppliers.length} 个供应商)`, 'success');
      githubCheckStatus();
    } else if (putResp.status === 401) {
      showToast('Token 无效，请重新配置', 'error');
    } else if (putResp.status === 403) {
      showToast('Token 权限不足，请检查仓库 Contents 写入权限', 'error');
    } else if (putResp.status === 409) {
      showToast('文件已被修改，请先拉取云端数据', 'error');
    } else {
      const errData = await putResp.json().catch(() => ({}));
      showToast(`推送失败 (HTTP ${putResp.status}): ${errData.message || ''}`, 'error');
    }
  } catch (e) {
    showToast('网络错误，推送失败', 'error');
  } finally {
    ghSyncing = false;
    updateSyncDot();
  }
}

async function githubPull() {
  const cfg = getGhConfig();
  if (!cfg || !cfg.token || !cfg.owner || !cfg.repo) {
    showToast('请先配置 GitHub 信息', 'error');
    openGithubSettings();
    return;
  }
  if (ghSyncing) { showToast('正在同步中，请稍候...', 'info'); return; }
  ghSyncing = true;
  updateSyncDot();
  showToast('正在从 GitHub 拉取数据...', 'info');

  try {
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
    const resp = await ghFetch(url, {
      headers: { 'Authorization': `Bearer ${cfg.token}`, 'Accept': 'application/vnd.github+json' }
    });

    if (resp.status === 200) {
      const data = await resp.json();
      const content = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, '')))));
      if (!content.suppliers || !Array.isArray(content.suppliers)) {
        showToast('云端数据格式异常', 'error');
        return;
      }
      // Confirm if local has data
      if (appData.suppliers.length > 0) {
        const confirmed = confirm(`云端有 ${content.suppliers.length} 个供应商，当前本地有 ${appData.suppliers.length} 个。\n拉取将覆盖本地数据，是否继续？`);
        if (!confirmed) {
          showToast('已取消', 'info');
          return;
        }
      }
      appData = mergeBrandDictBeforeOverwrite(content);
      ensureAppDataShape();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      hasUnsyncedChanges = false;
      selectedSupplierId = null;
      selectedProductKey = null;
      renderAll();
      showToast(`已从云端拉取 ${content.suppliers.length} 个供应商`, 'success');
      closeModal();
    } else if (resp.status === 404) {
      showToast('云端暂无数据，请先推送', 'warn');
    } else if (resp.status === 401) {
      showToast('Token 无效，请重新配置', 'error');
    } else {
      showToast(`拉取失败 (HTTP ${resp.status})`, 'error');
    }
  } catch (e) {
    showToast('网络错误，拉取失败', 'error');
  } finally {
    ghSyncing = false;
    updateSyncDot();
  }
}

function setupAutoSync() {
  if (ghSyncTimer) { clearTimeout(ghSyncTimer); ghSyncTimer = null; }
  const cfg = getGhConfig();
  if (cfg && cfg.autoSync && cfg.token && cfg.owner && cfg.repo) {
    ghSyncTimer = setTimeout(() => {
      githubSync();
    }, 5000);
  }
}

// Auto-sync on page hide + auto-pull on page show
let autoPullTimer = null;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    // Page going to background — push unsynced changes immediately
    if (hasUnsyncedChanges) {
      githubSync();
    }
  } else if (document.visibilityState === 'visible') {
    // Page back to foreground — pull latest from cloud
    autoPullFromCloud();
    // Restart periodic auto-pull
    if (autoPullTimer) clearInterval(autoPullTimer);
    autoPullTimer = setInterval(autoPullFromCloud, 60000);
  }
});

// Start periodic auto-pull on init
function startAutoPullTimer() {
  if (autoPullTimer) clearInterval(autoPullTimer);
  autoPullTimer = setInterval(autoPullFromCloud, 60000);
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.suppliers || !Array.isArray(data.suppliers)) throw new Error('Invalid format');
      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
          <div class="modal" style="max-width:400px">
            <div class="modal-header">
              <h3>确认导入数据</h3>
              <button class="btn-icon" onclick="closeModal()">&#x2715;</button>
            </div>
            <div class="modal-body">
              <div class="confirm-dialog">
                <p>将要导入 <span class="highlight">${data.suppliers.length}</span> 个供应商</p>
                <p style="font-size:12px;color:var(--danger);margin-top:8px">导入将覆盖当前所有数据，建议先导出备份！</p>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn" onclick="closeModal()">取消</button>
              <button class="btn btn-primary" onclick="confirmImport('${btoa(JSON.stringify(data))}')">确认导入</button>
            </div>
          </div>
        </div>
      `;
    } catch(e) {
      showToast('文件格式错误，请选择有效的 JSON 备份文件', 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function confirmImport(dataB64) {
  try {
    const data = JSON.parse(atob(dataB64));
    appData = data;
    ensureAppDataShape();
    selectedSupplierId = null;
    saveData();
    closeModal();
    renderAll();
    showToast('数据导入成功', 'success');
  } catch(e) {
    showToast('导入失败', 'error');
  }
}

function exportCSV() {
  const BOM = '\uFEFF';
  const headers = ['供应商名称', '供应商类型', '所在地区', '合作状态', '品牌', '品牌英文名', '品牌中文名', '产品线', '主要系列', '产品线备注', '主联系人', '联系人职位', '联系人手机', '联系人微信', '联系人邮箱', '联系人备注', '供应商备注'];
  let rows = [headers.join(',')];

  appData.suppliers.forEach(s => {
    const st = STATUS_MAP[s.status]?.label || s.status;
    const type = TYPE_MAP[s.type] || s.type;
    const mainContact = s.contacts[0] || {};

    if (s.productLines.length === 0) {
      rows.push([
        escCsv(s.name), escCsv(type), escCsv(s.region), escCsv(st),
        '', '', '', '', '', '',
        escCsv(mainContact.name || ''), escCsv(mainContact.position || ''),
        escCsv(mainContact.phone || ''), escCsv(mainContact.wechat || ''),
        escCsv(mainContact.email || ''), escCsv(mainContact.remark || ''),
        escCsv(s.remark)
      ].join(','));
    } else {
      s.productLines.forEach(pl => {
        const bf = brandFieldsOf(pl);
        rows.push([
          escCsv(s.name), escCsv(type), escCsv(s.region), escCsv(st),
          escCsv(brandDisplay(pl)), escCsv(bf.en), escCsv(bf.zh.join('、')),
          escCsv(pl.lineName), escCsv(pl.mainSeries), escCsv(pl.remark),
          escCsv(mainContact.name || ''), escCsv(mainContact.position || ''),
          escCsv(mainContact.phone || ''), escCsv(mainContact.wechat || ''),
          escCsv(mainContact.email || ''), escCsv(mainContact.remark || ''),
          escCsv(s.remark)
        ].join(','));
      });
    }
  });

  const blob = new Blob([BOM + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `供应商导出_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV 已下载（可用 Excel 打开）', 'success');
}

function escCsv(str) {
  if (!str) return '';
  if (str.includes(',') || str.includes('"') || str.includes('\n')) {
    return '"' + str.replace(/"/g, '""') + '"';
  }
  return str;
}

/* ===== Excel 导出 (SheetJS) ===== */
function exportExcel() {
  if (typeof XLSX === 'undefined') {
    showToast('Excel 组件未加载，正在使用 CSV 方式导出...', 'info');
    exportCSV();
    return;
  }

  const headers = ['供应商名称', '供应商类型', '所在地区', '合作状态', '品牌', '品牌英文名', '品牌中文名', '产品线', '主要系列', '产品线备注', '主联系人', '联系人职位', '联系人手机', '联系人微信', '联系人邮箱', '联系人备注', '供应商备注'];
  const aoa = [headers];

  appData.suppliers.forEach(s => {
    const st = STATUS_MAP[s.status]?.label || s.status;
    const type = TYPE_MAP[s.type] || s.type;
    const mc = s.contacts[0] || {};
    const contactRow = [mc.name || '', mc.position || '', mc.phone || '', mc.wechat || '', mc.email || '', mc.remark || ''];

    if (s.productLines.length === 0) {
      aoa.push([s.name, type, s.region, st, '', '', '', '', '', '', ...contactRow, s.remark || '']);
    } else {
      s.productLines.forEach(pl => {
        const bf = brandFieldsOf(pl);
        aoa.push([s.name, type, s.region, st, brandDisplay(pl), bf.en, bf.zh.join('、'), pl.lineName, pl.mainSeries, pl.remark, ...contactRow, s.remark || '']);
      });
    }
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [
    { wch: 18 }, { wch: 10 }, { wch: 10 }, { wch: 8 },
    { wch: 30 }, { wch: 22 }, { wch: 18 },
    { wch: 16 }, { wch: 28 }, { wch: 20 },
    { wch: 10 }, { wch: 12 }, { wch: 15 }, { wch: 15 }, { wch: 20 }, { wch: 18 }, { wch: 18 }
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '供应商数据');

  XLSX.writeFile(wb, `供应商导出_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('Excel 已下载', 'success');
}
